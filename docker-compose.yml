
services:
  db:
    image: postgres:17-alpine
    container_name: curio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: curio
      POSTGRES_PASSWORD: curio_dev_password
      POSTGRES_DB: curio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curio -d curio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
